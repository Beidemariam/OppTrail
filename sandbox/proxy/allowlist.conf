# Egress allowlist for the autopilot sandbox. A leading dot matches subdomains.
# Anything absent from this file is refused, and the refusal is logged.
#
# Keep this list minimal and justified. Adding a host widens what an agent
# could reach, and the point of the sandbox is that the list is the boundary.

# Claude Code: API, sign-in, and the telemetry endpoint it calls on startup.
.anthropic.com
claude.ai

# Python packaging (uv, pip-audit).
pypi.org
files.pythonhosted.org

# Node packaging (npm ci, npm audit).
registry.npmjs.org

# Source archives that uv and npm resolve dependencies from, and the Python
# builds uv installs.
github.com
codeload.github.com
.githubusercontent.com

# Playwright browser downloads (Phase F, brief 4.7). System libraries are baked
# into the image; these serve the browser binaries themselves.
cdn.playwright.dev
playwright.download.prss.microsoft.com
