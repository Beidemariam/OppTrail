http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowlist.conf"
acl SSL_ports port 443
acl CONNECT method CONNECT

# Deny tunnelling to anything but 443, so CONNECT cannot be used to reach
# arbitrary services (SSH, databases, SMTP) on an allowlisted host.
http_access deny CONNECT !SSL_ports

http_access allow allowed_domains
http_access deny all

# No caching: this is a filter, not an accelerator, and a cache would only
# obscure what was actually fetched.
cache deny all
cache_store_log none
access_log stdio:/var/log/squid/access.log

# Do not advertise the proxy or the client to the outside.
forwarded_for delete
via off
httpd_suppress_version_string on

dns_v4_first on
shutdown_lifetime 3 seconds
