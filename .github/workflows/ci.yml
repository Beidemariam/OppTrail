name: CI

# `make check` on every push to main, plus the two Docker-only steps the
# autopilot sandbox cannot run (no Docker socket — sandbox/README.md).
#
# Phase 1 built the first half of this (review blocker B4): `make check-fast`
# and the image build. Milestone **R.6** is the rest — the dependency audits,
# the Playwright suite, and the coverage and report artifacts that make a
# failure readable without re-running anything locally.
#
# Deliberately not pushed to a remote by the autopilot: the roadmap's R.6 says
# "create the workflow file; do not push it", so this is reviewed as code and
# takes effect whenever the repository gets a remote.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: make check
    runs-on: ubuntu-latest
    # The e2e suite builds the frontend and boots the real server; 20 minutes
    # is roughly three times the measured run, so a hang fails rather than
    # burning an hour.
    timeout-minutes: 20
    env:
      # Written for the artifact below. On the command line rather than in
      # `pyproject.toml` so a local `make check-fast` still leaves no files
      # behind — CI is the only place that wants a coverage file on disk.
      PYTEST_ADDOPTS: --cov-report=xml
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same three packages the Dockerfile installs, so this job's pytest run
      # exercises the WeasyPrint PDF path too instead of skipping it (see
      # CLAUDE.md's WeasyPrint section — without them the test skips rather
      # than fails, but skipping here would mean nothing in CI ever proves
      # PDF export works outside the image-build job below).
      - name: Install WeasyPrint native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libharfbuzz-subset0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0

      # `--with-deps` installs the shared libraries Chromium needs on a bare
      # runner. Cached by version, because this is the slowest step here.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      # Everything: ruff, mypy, typecheck, lint, prettier, both test suites
      # with their coverage floors, the generated API client check, pip-audit,
      # the npm audit ratchet (scripts/audit-gate.mjs, D-207) and the
      # Playwright suite.
      - name: make check
        run: make check

      # Coverage from both suites, and Playwright's report. `always()` so a
      # failed run is the one you can actually read — a trace and a screenshot
      # per failed test are in `test-results/`.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/coverage.xml
            frontend/coverage/
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: docker build, in-image backend suite, smoke test
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Build the application image
        run: make docker

      # D-045/D-046/D-047 (docs/autopilot/DECISIONS.md, phase 1 rework): names
      # an environment divergence by version number instead of waiting for it
      # to surface as an unrelated test failure downstream, which is how
      # docs/autopilot/reviews/phase-1-review-1.md's finding 2 was first found.
      # D-045 was ruled (a) and applied — the image moved to a trixie base —
      # and D-047 changed this from an equality check, which three
      # independently packaged environments could never satisfy, to a floor the
      # image must meet. It is green and is a real gate.
      - name: SQLite version floor (image)
        run: make sqlite-version-check

      # ROADMAP.md Phase 1: "the backend suite inside the image" — the same
      # Debian base and pinned WeasyPrint libraries as the shipped image.
      - name: Run the backend suite inside the image
        run: make docker-test

      # Health, the two probes, the container's own HEALTHCHECK reaching
      # `healthy`, a seeded sign-in, an opportunity, and a PDF export (R.4).
      - name: Docker smoke test
        run: make docker-smoke
