# Alembic configuration for the OppTrail backend (ADR 0002).
#
# The database URL is not set here: `alembic/env.py` reads it from
# `app.settings.settings.database_url`, so the CLI and the application's
# startup migration always target the same file.
#
# Logging is likewise absent by design. The application configures structured
# JSON logging in `app.logging_utils.configure_logging()`, and `env.py` runs
# migrations at startup; letting Alembic reconfigure logging from this file
# would replace that formatter mid-boot.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
