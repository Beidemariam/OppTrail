[project]
name = "opptrail-backend"
version = "0.1.0"
description = "FastAPI backend for OppTrail"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    # ADR 0004 is this dependency's justification (`AGENTS.md` standard 8): a
    # broker is unjustifiable for a 20-user single-container app, and host cron
    # splits the logic across the container boundary. Milestone 6.5 is the
    # first caller -- Phase 6's rules are time-triggered and `make backup` had
    # no schedule. 3.x rather than 4.x: 3.x's `AsyncIOScheduler` is what the
    # FastAPI `lifespan` needs and is the stable line.
    "apscheduler>=3.11.3",
    "bcrypt>=4.0",
    "fastapi>=0.116.0",
    "markdown-it-py>=4.2.0",
    "nh3>=0.3.7",
    "openai>=3.8.0",
    "pydantic-settings>=2.10.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35.0",
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pip-audit>=2.7.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)`/`Cookie(...)` default-argument pattern is idiomatic,
# not the mutable-default bug B008 exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Cookie",
    "fastapi.Query",
    "fastapi.Path",
    # `File(...)` is the same pattern, and the one route that takes a file
    # (milestone 4.3) declares it the way FastAPI documents.
    "fastapi.File",
]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
files = ["app", "tools"]

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true

# APScheduler 3.x ships no `py.typed` (milestone 6.5). Scoped to the two
# modules `app/scheduler.py` imports rather than silencing the whole package's
# surface, and `scheduler.py` is deliberately the only file that imports it --
# every job is in `jobs.py`, which stays fully typed.
[[tool.mypy.overrides]]
module = ["apscheduler.schedulers.asyncio", "apscheduler.triggers.interval"]
ignore_missing_imports = true
