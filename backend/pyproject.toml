[project]
name = "opptrail-backend"
version = "0.1.0"
description = "FastAPI backend for OppTrail"
requires-python = ">=3.13"
dependencies = [
    "bcrypt<5",
    "fastapi>=0.116.0",
    "openai>=3.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
